name: Testes (build Windows sob demanda)

on:
  push:
    branches: [main, feature/iq-signal-classifier]
  pull_request:
  workflow_dispatch:
    inputs:
      build_windows:
        description: "Gerar executável do Windows"
        type: boolean
        default: false
      diagnose_windows:
        description: "Diagnósticos nativos repetitivos somente sob hipótese nova (branch experimental)"
        type: boolean
        default: false

# Superseded experimental push runs waste Windows runner minutes and cannot
# certify the current HEAD. Do not cancel main/release or PR event checks.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref == 'refs/heads/feature/iq-signal-classifier' }}

jobs:

  tests:
    # Official Ubuntu Noble browser-test image includes libEGL and Qt graphics
    # libraries. The hosted runner apt mirrors currently fail DNS resolution.
    runs-on: ubuntu-24.04
    container:
      image: mcr.microsoft.com/playwright/python:v1.64.1-noble
    steps:
      - uses: actions/checkout@v4
      - name: Python runtime and graphics prerequisites
        run: |
          python --version
          ldconfig -p | grep 'libEGL.so.1'
      - run: python -m pip install numpy scipy PySide6==6.11.3 pyqtgraph pytest "sgp4>=2.23"
      - name: Testes Linux / Qt offscreen (diagnóstico independente)
        run: python -X faulthandler scripts/run_tests.py
        env:
          QT_QPA_PLATFORM: offscreen

  windows-tests:
    # Independent Windows/Qt test lane for experimental PRs; no installer or release.
    # Does not depend on Ubuntu apt mirrors, which can fail DNS before pytest starts.
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/feature/iq-signal-classifier'
    runs-on: windows-2022
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      QT_QPA_PLATFORM: offscreen
      # Diagnostic-only counts before/after pytest and before forced process
      # exit. Does not change release builds or the fail-closed crash gate.
      PT2VHF_CI_NATIVE_LIFECYCLE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Dependências dos testes (sem build de instalador)
        run: python -m pip install numpy scipy PySide6==6.11.3 pyqtgraph pytest "sgp4>=2.23"
      - name: Habilitar minidumps WER locais para falhas nativas Python
        shell: pwsh
        run: |
          $dumpDir = Join-Path $env:RUNNER_TEMP "pt2vhf-native-dumps"
          New-Item -ItemType Directory -Force -Path $dumpDir | Out-Null
          $key = "HKCU:\Software\Microsoft\Windows\Windows Error Reporting\LocalDumps\python.exe"
          New-Item -Path $key -Force | Out-Null
          New-ItemProperty -Path $key -Name DumpFolder -PropertyType ExpandString -Value $dumpDir -Force | Out-Null
          New-ItemProperty -Path $key -Name DumpType -PropertyType DWord -Value 1 -Force | Out-Null
          New-ItemProperty -Path $key -Name DumpCount -PropertyType DWord -Value 3 -Force | Out-Null
          (Get-Date).ToString("o") | Set-Content (Join-Path $env:RUNNER_TEMP "pt2vhf-wer-start.txt")
          Write-Host "WER LocalDumps configured (minidump only; runner-local, never uploaded)"
      - name: Testes Windows / Qt offscreen (falhar se houver crash nativo)
        run: python scripts/ci_windows_pytest.py
      - name: Diagnóstico WER após falha nativa (sem upload de dumps)
        if: failure()
        shell: pwsh
        run: |
          $dumpDir = Join-Path $env:RUNNER_TEMP "pt2vhf-native-dumps"
          $dumps = @(Get-ChildItem -Path $dumpDir -Filter "*.dmp" -File -ErrorAction SilentlyContinue)
          if ($dumps.Count -eq 0) {
            Write-Host "WER: no python.exe minidump captured; absence does not exclude native corruption"
          } else {
            foreach ($dump in $dumps) {
              Write-Host ("WER minidump: {0} bytes={1} SHA256={2}" -f $dump.Name, $dump.Length, (Get-FileHash -Path $dump.FullName -Algorithm SHA256).Hash.ToLower())
            }
          }
          $start = [datetime]::Parse((Get-Content (Join-Path $env:RUNNER_TEMP "pt2vhf-wer-start.txt") -Raw))
          try {
            $events = @(Get-WinEvent -FilterHashtable @{LogName='Application'; Id=1000,1001; StartTime=$start} -ErrorAction Stop |
              Where-Object { $_.Message -match '(?i)python(\.exe)?|pt2vhf' } | Select-Object -First 8)
            if ($events.Count -eq 0) { Write-Host "WER: no matching Application Error / Windows Error Reporting events" }
            foreach ($event in $events) {
              Write-Host ("WER event ID={0} time={1}" -f $event.Id, $event.TimeCreated.ToString("o"))
              Write-Host ($event.Message.Substring(0, [Math]::Min(1800, $event.Message.Length)))
            }
          } catch {
            Write-Host "WER event query unavailable: $($_.Exception.Message)"
          }
          Write-Host "Privacy: dump files stay on ephemeral runner; no artifact upload or release."


  # One-time Qt DeferredDelete A/B retired after CI #43248657060:
  # 405 passed/2 skipped; 666 hidden top-level widgets; 666 deleteLater()
  # requests queued with zero Python errors, then sendPostedEvents(DeferredDelete)
  # triggered Fatal Python error: Aborted before the post-disposal census.
  # This is NOT a fix; mandatory windows-tests stays fail-closed.
  # Manual-only code is retained for reproducibility; do not rerun on pushes.

  # Runtime A/B (Python 3.11/3.12 x PySide6 6.9.3/6.11.3) retired after
  # all 8 isolated UI cases reproduced native crashes in CI #43177095139.
  # Preserve the evidence in docs; do not rerun this exhausted matrix on pushes.

  windows-native-stack-probe:
    # ONE-TIME experimental diagnosis of the first-chance native AV in
    # scripts/run_tests.py at os._exit. Retire after interpreting this run.
    # Not a release gate, not an installer, no memory/dump artifacts uploaded.
    # Run only for trusted pushes to the experimental branch (never forks/PRs).
    if: github.event_name == 'push' && github.ref == 'refs/heads/feature/iq-signal-classifier'
    runs-on: windows-2022
    timeout-minutes: 35
    permissions:
      contents: read
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Dependencies for native diagnosis (no installer)
        run: python -m pip install numpy scipy PySide6==6.11.3 pyqtgraph pytest "sgp4>=2.23"
      - name: Install official Microsoft CDB debugger (Windows SDK debug tools only)
        shell: pwsh
        run: |
          $sdk = Join-Path $env:RUNNER_TEMP "pt2vhf-sdksetup.exe"
          $installLog = Join-Path $env:RUNNER_TEMP "pt2vhf-sdk-install.log"
          Invoke-WebRequest -Uri "https://go.microsoft.com/fwlink/?linkid=2338977" -OutFile $sdk
          $arguments = '/quiet /norestart /features OptionId.WindowsDesktopDebuggers /log "{0}"' -f $installLog
          $process = Start-Process -FilePath $sdk -ArgumentList $arguments -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Debug tools install failed: $($process.ExitCode)" }
          if (-not (Test-Path "C:\Program Files (x86)\Windows Kits\10\Debuggers\x64\cdb.exe")) {
            throw "CDB unavailable after SDK install"
          }
          Write-Host "CI-NATIVE-STACK debugger=cdb-ready"
      - name: Capture first-chance AV module and symbolic stack without uploading memory
        shell: pwsh
        run: |
          $cdb = "C:\Program Files (x86)\Windows Kits\10\Debuggers\x64\cdb.exe"
          $log = Join-Path $env:RUNNER_TEMP "pt2vhf-native-cdb.log"
          # CDB command runs on the FIRST access violation, if observed.
          # The raw log stays runner-local; parser emits module!symbol only.
          & $cdb -logo $log -G -c 'sxe -c ".ecxr;kv 24;q" av;g' python.exe -X faulthandler scripts/run_tests.py *> $null
          Write-Host "CI-NATIVE-STACK debugger_exit_code=$LASTEXITCODE"
          python scripts/ci_native_stack_summary.py $log
          if ($LASTEXITCODE -ne 0) {
            throw "No verified native AV stack (or CDB log unavailable); no QA promotion"
          }

  windows-crash-isolation:
    # Manual opt-in only: exhausted diagnostics are NOT repeated on every push.
    # If the complete Windows suite fails, run independent
    # IQ/non-IQ and hard/normal exit modes distinguish test scope from Qt teardown.
    # Never generates installers or publishes artifacts.
    needs: windows-tests
    if: ${{ always() && needs.windows-tests.result == 'failure' && github.event_name == 'workflow_dispatch' && inputs.diagnose_windows == true && github.ref == 'refs/heads/feature/iq-signal-classifier' }}
    runs-on: windows-2022
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - partition: iq-hard-exit
            selection: iq_
            exit_mode: hard
            shard: -1
          - partition: baseline-hard-exit
            selection: "not iq_"
            exit_mode: hard
            shard: -1
          - partition: baseline-normal-exit
            selection: "not iq_"
            exit_mode: normal
            shard: -1
          - partition: full-normal-exit
            selection: all
            exit_mode: normal
            shard: -1
          - partition: baseline-shard-0
            selection: "not iq_"
            exit_mode: hard
            shard: 0
          - partition: baseline-shard-1
            selection: "not iq_"
            exit_mode: hard
            shard: 1
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Dependências de diagnóstico (sem instalador)
        run: python -m pip install numpy scipy PySide6==6.11.3 pyqtgraph pytest "sgp4>=2.23"
      - name: Isolar crash nativo Windows por subconjunto
        if: matrix.shard == -1 && matrix.partition != 'full-normal-exit'
        env:
          PT2VHF_TEST_EXIT_MODE: ${{ matrix.exit_mode }}
        run: python scripts/ci_windows_pytest.py -k "${{ matrix.selection }}"
      - name: Diagnosticar suíte completa com saída normal
        if: matrix.partition == 'full-normal-exit'
        env:
          PT2VHF_TEST_EXIT_MODE: normal
        run: python scripts/ci_windows_pytest.py
      - name: Diagnosticar arquivos não-IQ em processos isolados
        if: matrix.shard >= 0
        env:
          PT2VHF_TEST_EXIT_MODE: hard
        run: python scripts/ci_windows_crash_shard.py --index ${{ matrix.shard }} --count 2

  windows-file-probe:
    # Manual opt-in after a native Windows crash; per-file isolation.
    # Keep disabled on ordinary pushes: previous per-file results are unchanged.
    # Never builds an installer or publishes releases.
    needs: windows-tests
    if: ${{ always() && needs.windows-tests.result == 'failure' && github.event_name == 'workflow_dispatch' && inputs.diagnose_windows == true && github.ref == 'refs/heads/feature/iq-signal-classifier' }}
    runs-on: windows-2022
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      QT_QPA_PLATFORM: offscreen
      PT2VHF_TEST_EXIT_MODE: hard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Dependências do diagnóstico por arquivo (sem instalador)
        run: python -m pip install numpy scipy PySide6==6.11.3 pyqtgraph pytest "sgp4>=2.23"
      - name: Isolar cada arquivo não-IQ em processo Windows independente
        run: python -m scripts.ci_windows_file_probe --timeout-seconds 180

  # QPA minimal/offscreen isolated case probe retired after CI #43213137478:
  # 4/9 hard-exit UI cases still crashed under minimal, matching the four
  # hard-exit cases previously observed under offscreen. The root cause is
  # unresolved; keep the mandatory Windows suite fail-closed. The manual
  # scripts/ci_windows_case_probe.py tool remains available for new hypotheses.

  windows-exe:
    # Manual e commit [build-windows] SOMENTE na main; branch experimental nao gera instaladores.
    if: github.ref == 'refs/heads/main' && ((github.event_name == 'workflow_dispatch' && inputs.build_windows) || (github.event_name == 'push' && contains(github.event.head_commit.message, '[build-windows]')))
    permissions:
      contents: write
    runs-on: windows-2022  # validação obrigatória para distribuição Windows, independente do Qt Linux
    timeout-minutes: 90
    defaults:
      run:
        shell: pwsh
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Dependências
        run: pip install -r requirements-dev.txt
      - name: Testes no Windows
        run: python scripts/run_tests.py
      - name: Versão
        id: ver
        run: |
          $v = python packaging/make_version_info.py
          "version=$v" >> $env:GITHUB_OUTPUT
      - name: Driver RTL-SDR Blog (suporte ao V4)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $rel = gh api repos/rtlsdrblog/rtl-sdr-blog/releases/latest | ConvertFrom-Json
          "Release do driver RTL-SDR Blog: $($rel.tag_name)"
          New-Item -ItemType Directory -Force blogdl, packaging\rtlsdr_blog | Out-Null
          foreach ($a in $rel.assets) {
            if ($a.name -like '*.zip') {
              "Baixando $($a.name)"
              Invoke-WebRequest -Uri $a.browser_download_url -OutFile "blogdl\$($a.name)"
              Expand-Archive -Force "blogdl\$($a.name)" "blogdl\$($a.name -replace '\.zip$','')"
            }
          }
          Get-ChildItem -Recurse blogdl -Filter *.dll | ForEach-Object { $_.FullName }
          $dll = Get-ChildItem -Recurse blogdl -Filter rtlsdr.dll | Where-Object { $_.FullName -match 'x64|64' } | Select-Object -First 1
          if (-not $dll) { throw 'rtlsdr.dll x64 do driver RTL-SDR Blog não encontrado na release' }
          # todas as DLLs da pasta x64 (rtlsdr.dll + dependências: pthreadVC2, msvcr100, libusb se separada)
          Get-ChildItem $dll.DirectoryName -Filter *.dll | Copy-Item -Destination packaging\rtlsdr_blog\
          "Driver RTL-SDR Blog $($rel.tag_name) (GPLv2): https://github.com/rtlsdrblog/rtl-sdr-blog" | Out-File packaging\rtlsdr_blog\LICENSE.txt
          Get-ChildItem packaging\rtlsdr_blog
      - name: libwdi wdi-simple (driver WinUSB do RTL-SDR, como no Sat Tool)
        shell: cmd
        env:
          WDK_URL: https://go.microsoft.com/fwlink/p/?LinkID=253170
        run: |
          git clone --depth 1 --branch v1.5.1 https://github.com/pbatard/libwdi.git ..\libwdi || exit /b 1
          cd ..\libwdi
          rem Somente WinUSB: retira libusb0/libusbK do embedder (o PT2VHF nunca instala esses drivers).
          powershell -NoProfile -Command "(Get-Content msvc\config.h) | Where-Object { $_ -notmatch '^#define LIBUSB(0|K)_DIR' } | Set-Content msvc\config.h" || exit /b 1
          findstr /L /C:"#define LIBUSB0_DIR" /C:"#define LIBUSBK_DIR" msvc\config.h && exit /b 1
          curl -sSL %WDK_URL% -o wdk-redist.msi || exit /b 1
          msiexec /a wdk-redist.msi /qn TARGETDIR=%CD%\wdk
          if not exist "wdk\Windows Kits\8.0\redist\wdf\x64" (echo WDK redist ausente & exit /b 1)
          for /f "usebackq delims=" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.Component.MSBuild -property installationPath`) do set VSDIR=%%i
          if not defined VSDIR (echo Visual Studio nao encontrado & exit /b 1)
          call "%VSDIR%\Common7\Tools\VsDevCmd.bat" -arch=x64 >nul
          msbuild libwdi.sln /m /p:Configuration=Release,Platform=Win32,BuildMacros="WDK_DIR=\"../wdk/Windows Kits/8.0\"" || exit /b 1
          msbuild libwdi.sln /m /p:Configuration=Release,Platform=x64,BuildMacros="WDK_DIR=\"../wdk/Windows Kits/8.0\"" || exit /b 1
          if not exist x64\Release\examples\wdi-simple.exe exit /b 1
          mkdir %GITHUB_WORKSPACE%\drivers
          copy /y x64\Release\examples\wdi-simple.exe %GITHUB_WORKSPACE%\drivers\ || exit /b 1
          copy /y COPYING-LGPL %GITHUB_WORKSPACE%\drivers\libwdi-COPYING-LGPL.txt
          %GITHUB_WORKSPACE%\drivers\wdi-simple.exe --help | findstr /C:"WinUSB" || exit /b 1
      - name: PyInstaller (pasta + portátil)
        run: pyinstaller --noconfirm pt2vhf.spec
      - name: Autoteste dos executáveis
        run: |
          foreach ($exe in @("dist\PT2VHF-SDR-Tool\PT2VHF-SDR-Tool.exe", "dist\PT2VHF-SDR-Tool-Portable.exe")) {
            $p = Start-Process -FilePath $exe -ArgumentList "--selftest" -Wait -PassThru
            Get-Content "$env:TEMP\pt2vhf-sdr-selftest.log"
            if ($p.ExitCode -ne 0) { throw "Autoteste falhou: $exe" }
          }
      - name: Instalador (Inno Setup)
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress; }
          & $iscc "/DAppVersion=${{ steps.ver.outputs.version }}" packaging\installer.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC falhou" }
      - name: Instalar em silêncio (sem administrador) e testar o programa instalado
        run: |
          $setup = "dist\PT2VHF-SDR-Tool-v${{ steps.ver.outputs.version }}-Win11-x64-Setup.exe"
          $p = Start-Process -FilePath $setup -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART","/CURRENTUSER" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "Instalação falhou" }
          $dir = Join-Path $env:LOCALAPPDATA "Programs\PT2VHF SDR Tool"
          if (-not (Test-Path "$dir\unins000.exe")) { throw "Instalação por usuário não encontrada em $dir" }
          if (-not (Test-Path "$dir\_internal\drivers\wdi-simple.exe")) { throw "wdi-simple.exe ausente da instalação" }
          $p = Start-Process -FilePath "$dir\PT2VHF-SDR-Tool.exe" -ArgumentList "--selftest" -Wait -PassThru
          Get-Content "$env:TEMP\pt2vhf-sdr-selftest.log"
          if ($p.ExitCode -ne 0) { throw "Programa instalado falhou no autoteste" }
      - name: Pacotes finais e SHA-256
        run: |
          $v = "${{ steps.ver.outputs.version }}"
          New-Item -ItemType Directory -Force release | Out-Null
          Copy-Item "dist\PT2VHF-SDR-Tool-v$v-Win11-x64-Setup.exe" release\
          Copy-Item "dist\PT2VHF-SDR-Tool-Portable.exe" "release\PT2VHF-SDR-Tool-v$v-Win11-x64-Portable.exe"
          Get-ChildItem release | ForEach-Object { "{0}  {1}  {2}" -f (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower(), $_.Length, $_.Name } | Tee-Object release\SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: PT2VHF-SDR-Tool-${{ steps.ver.outputs.version }}-windows
          path: release/
      - name: Publicar Release GitHub (origem para o site)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, '[build-windows]')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $v = "${{ steps.ver.outputs.version }}"
          $assets = @(Get-ChildItem release -File | ForEach-Object { $_.FullName })
          & gh release create "v$v" $assets --repo "${{ github.repository }}" --target "${{ github.sha }}" `
            --title "PT2VHF SDR Tool $v" `
            --notes "Origem de pacotes para https://www.pt2vhf.com/sdr. Distribuição oficial somente pelo site."
          if ($LASTEXITCODE -ne 0) { throw "Falha ao publicar a Release GitHub" }
