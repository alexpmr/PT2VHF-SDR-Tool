name: Testes (build Windows sob demanda)

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      build_windows:
        description: "Gerar executável do Windows"
        type: boolean
        default: false

jobs:
  tests:
    # Official Ubuntu Noble browser-test image bundles libEGL and other Qt/GUI
    # system dependencies; hosted runner apt mirrors are unavailable.
    runs-on: ubuntu-24.04
    container:
      image: mcr.microsoft.com/playwright/python:v1.64.1-noble
    steps:
      - uses: actions/checkout@v4
      - name: Python runtime and graphics prerequisites
        run: |
          python --version
          ldconfig -p | grep 'libEGL.so.1'
      - run: python -m pip install numpy scipy PySide6==6.11.3 pyqtgraph pytest "sgp4>=2.23"
      - name: Testes Linux / Qt offscreen (diagnóstico independente)
        run: python -X faulthandler scripts/run_tests.py
        env:
          QT_QPA_PLATFORM: offscreen

  windows-exe:
    # Manual ou commit explícito [build-windows] (não compilar em cada push).
    if: (github.event_name == 'pull_request' && (startsWith(github.head_ref, 'release/stable-') || startsWith(github.head_ref, 'fix/ota-') || startsWith(github.head_ref, 'fix/crash-'))) || (github.event_name == 'workflow_dispatch' && inputs.build_windows) || (github.event_name == 'push' && contains(github.event.head_commit.message, '[build-windows]'))
    permissions:
      contents: write
    runs-on: windows-2022  # validação obrigatória para distribuição Windows, independente do Qt Linux
    timeout-minutes: 90
    defaults:
      run:
        shell: pwsh
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Dependências
        run: pip install -r requirements-dev.txt
      - name: Testes no Windows
        run: python scripts/run_tests.py
      - name: P0 - smoke do coletor local de eventos Windows (sem telemetria)
        run: |
          $path = Join-Path $env:TEMP "pt2vhf-wer-ci.txt"
          .\\scripts\\collect_windows_crash_evidence.ps1 -Days 1 -OutputFile $path
          if ($LASTEXITCODE -ne 0 -and $null -ne $LASTEXITCODE) { throw "WER collector failed" }
          if (-not (Test-Path -LiteralPath $path)) { throw "WER summary missing" }
          $data = Get-Content -LiteralPath $path -Raw
          if (-not $data.Contains("PT2VHF SDR Tool - Windows crash event summary")) { throw "WER summary invalid" }
          Remove-Item -LiteralPath $path -Force
          .\\scripts\\test_windows_crash_evidence.ps1
      - uses: actions/checkout@v4
        with:
          ref: v0.13.2
          path: baseline-v0132
      - name: P0 - focused pan callback lifetime A/B (20 repeats per case)
        run: |
          $PSNativeCommandUseErrorActionPreference = $false
          $cases = @("waterfall-empty", "waterfall-empty-no-pan-signals", "waterfall-empty-no-spec-pan-signal", "waterfall-empty-no-wf-pan-signal", "waterfall-empty-pan-weakrefs")
          python -X faulthandler scripts/probe_qt_native_exit.py --source-root baseline-v0132 --repeats 20 --scenarios $cases --exit-modes normal
          $baseline = $LASTEXITCODE
          python -X faulthandler scripts/probe_qt_native_exit.py --repeats 20 --scenarios $cases --exit-modes normal
          $candidate = $LASTEXITCODE
          Write-Host "P0 focused diagnostic (expected baseline failures): v0.13.2=$baseline candidate=$candidate"
          # The baseline is expected to fail; the candidate must pass all focused cases.
          if ($candidate -ne 0) { throw "P0 candidate failed focused pan lifetime matrix" }
      - name: P0 - extended Windows Qt shutdown soak (100x, candidate only)
        run: |
          # Process-level exit status catches native heap corruption after pytest finishes.
          # Synthetic Qt only: does not replace a prolonged real-SDR hardware soak.
          python -X faulthandler scripts/probe_qt_native_exit.py --repeats 100 --scenarios waterfall-empty waterfall --exit-modes normal
          if ($LASTEXITCODE -ne 0) { throw "P0 candidate failed 100x Windows native shutdown soak" }
      - uses: actions/checkout@v4
        with:
          ref: v0.13.3
          path: baseline-v0133
      - name: P0 - focused native Qt shutdown matrix on released v0.13.3
        run: |
          # Compare the reported release with v0.13.2 and the candidate using
          # the same five scenarios and 20 subprocesses per scenario.
          # This is a shutdown-only synthetic A/B, not the field crash.
          $PSNativeCommandUseErrorActionPreference = $false
          $cases = @("waterfall-empty", "waterfall-empty-no-pan-signals", "waterfall-empty-no-spec-pan-signal", "waterfall-empty-no-wf-pan-signal", "waterfall-empty-pan-weakrefs")
          python -X faulthandler scripts/probe_qt_native_exit.py --source-root baseline-v0133 --repeats 20 --scenarios $cases --exit-modes normal
          $released133 = $LASTEXITCODE
          Write-Host "P0 focused released v0.13.3 diagnostic: exit=$released133 (0=all passed; 1=native failures)"
          # Baseline is observational: do not hide or normalize its failures.
          # The candidate is already a mandatory gate in the preceding step.
      - name: P0 - continuous Qt operational soak (v0.13.2 / v0.13.3 / candidate)
        run: |
          # Same 45-second synthetic workload on both released tags and candidate.
          # Historical runs are diagnostic only: native shutdown corruption exists in v0.13.2.
          # Candidate must survive both sessions and normal process teardown.
          $PSNativeCommandUseErrorActionPreference = $false
          python -X faulthandler scripts/probe_qt_operational_soak.py --source-root baseline-v0132 --seconds 45 --repeats 1
          $baseline132 = $LASTEXITCODE
          python -X faulthandler scripts/probe_qt_operational_soak.py --source-root baseline-v0133 --seconds 45 --repeats 2
          $baseline133 = $LASTEXITCODE
          python -X faulthandler scripts/probe_qt_operational_soak.py --seconds 45 --repeats 2
          $candidate = $LASTEXITCODE
          Write-Host "P0 continuous Qt soak: v0.13.2=$baseline132 v0.13.3=$baseline133 candidate=$candidate"
          # A nonzero historical status does not establish a field crash root cause.
          if ($candidate -ne 0) { throw "P0 candidate failed continuous operational Qt soak" }
      - name: P0 - compare native Qt shutdown against v0.13.2
        run: |
          $PSNativeCommandUseErrorActionPreference = $false
          python -X faulthandler scripts/probe_qt_native_exit.py --source-root baseline-v0132 --repeats 3 --frames 120
          $baseline = $LASTEXITCODE
          python -X faulthandler scripts/probe_qt_native_exit.py --repeats 3 --frames 120
          $candidate = $LASTEXITCODE
          Write-Host "Native exit probe: v0.13.2=$baseline candidate=$candidate"
          # Historical v0.13.2 failures are recorded but must not mask candidate validation.
          if ($candidate -ne 0) { throw "P0 candidate native Qt shutdown probe failed" }
      - name: Smoke OTA portátil (helper, backup e falha segura)
        run: .\scripts\test_ota_windows.ps1
      - name: Versão
        id: ver
        run: |
          $v = python packaging/make_version_info.py
          "version=$v" >> $env:GITHUB_OUTPUT
      - name: Driver RTL-SDR Blog (suporte ao V4)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $rel = gh api repos/rtlsdrblog/rtl-sdr-blog/releases/latest | ConvertFrom-Json
          "Release do driver RTL-SDR Blog: $($rel.tag_name)"
          New-Item -ItemType Directory -Force blogdl, packaging\rtlsdr_blog | Out-Null
          foreach ($a in $rel.assets) {
            if ($a.name -like '*.zip') {
              "Baixando $($a.name)"
              Invoke-WebRequest -Uri $a.browser_download_url -OutFile "blogdl\$($a.name)"
              Expand-Archive -Force "blogdl\$($a.name)" "blogdl\$($a.name -replace '\.zip$','')"
            }
          }
          Get-ChildItem -Recurse blogdl -Filter *.dll | ForEach-Object { $_.FullName }
          $dll = Get-ChildItem -Recurse blogdl -Filter rtlsdr.dll | Where-Object { $_.FullName -match 'x64|64' } | Select-Object -First 1
          if (-not $dll) { throw 'rtlsdr.dll x64 do driver RTL-SDR Blog não encontrado na release' }
          # todas as DLLs da pasta x64 (rtlsdr.dll + dependências: pthreadVC2, msvcr100, libusb se separada)
          Get-ChildItem $dll.DirectoryName -Filter *.dll | Copy-Item -Destination packaging\rtlsdr_blog\
          "Driver RTL-SDR Blog $($rel.tag_name) (GPLv2): https://github.com/rtlsdrblog/rtl-sdr-blog" | Out-File packaging\rtlsdr_blog\LICENSE.txt
          Get-ChildItem packaging\rtlsdr_blog
      - name: libwdi wdi-simple (driver WinUSB do RTL-SDR, como no Sat Tool)
        shell: cmd
        env:
          WDK_URL: https://go.microsoft.com/fwlink/p/?LinkID=253170
        run: |
          git clone --depth 1 --branch v1.5.1 https://github.com/pbatard/libwdi.git ..\libwdi || exit /b 1
          cd ..\libwdi
          rem Somente WinUSB: retira libusb0/libusbK do embedder (o PT2VHF nunca instala esses drivers).
          powershell -NoProfile -Command "(Get-Content msvc\config.h) | Where-Object { $_ -notmatch '^#define LIBUSB(0|K)_DIR' } | Set-Content msvc\config.h" || exit /b 1
          findstr /L /C:"#define LIBUSB0_DIR" /C:"#define LIBUSBK_DIR" msvc\config.h && exit /b 1
          curl -sSL %WDK_URL% -o wdk-redist.msi || exit /b 1
          msiexec /a wdk-redist.msi /qn TARGETDIR=%CD%\wdk
          if not exist "wdk\Windows Kits\8.0\redist\wdf\x64" (echo WDK redist ausente & exit /b 1)
          for /f "usebackq delims=" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.Component.MSBuild -property installationPath`) do set VSDIR=%%i
          if not defined VSDIR (echo Visual Studio nao encontrado & exit /b 1)
          call "%VSDIR%\Common7\Tools\VsDevCmd.bat" -arch=x64 >nul
          msbuild libwdi.sln /m /p:Configuration=Release,Platform=Win32,BuildMacros="WDK_DIR=\"../wdk/Windows Kits/8.0\"" || exit /b 1
          msbuild libwdi.sln /m /p:Configuration=Release,Platform=x64,BuildMacros="WDK_DIR=\"../wdk/Windows Kits/8.0\"" || exit /b 1
          if not exist x64\Release\examples\wdi-simple.exe exit /b 1
          mkdir %GITHUB_WORKSPACE%\drivers
          copy /y x64\Release\examples\wdi-simple.exe %GITHUB_WORKSPACE%\drivers\ || exit /b 1
          copy /y COPYING-LGPL %GITHUB_WORKSPACE%\drivers\libwdi-COPYING-LGPL.txt
          %GITHUB_WORKSPACE%\drivers\wdi-simple.exe --help | findstr /C:"WinUSB" || exit /b 1
      - name: PyInstaller (pasta + portátil)
        run: pyinstaller --noconfirm pt2vhf.spec
      - name: Autoteste dos executáveis
        run: |
          foreach ($exe in @("dist\PT2VHF-SDR-Tool\PT2VHF-SDR-Tool.exe", "dist\PT2VHF-SDR-Tool-Portable.exe")) {
            $p = Start-Process -FilePath $exe -ArgumentList "--selftest" -Wait -PassThru
            Get-Content "$env:TEMP\pt2vhf-sdr-selftest.log"
            if ($p.ExitCode -ne 0) { throw "Autoteste falhou: $exe" }
          }
      - name: Instalador (Inno Setup)
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress; }
          & $iscc "/DAppVersion=${{ steps.ver.outputs.version }}" packaging\installer.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC falhou" }
      - name: Instalar em silêncio (sem administrador) e testar o programa instalado
        run: |
          $setup = "dist\PT2VHF-SDR-Tool-v${{ steps.ver.outputs.version }}-Win11-x64-Setup.exe"
          $p = Start-Process -FilePath $setup -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART","/CURRENTUSER" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "Instalação falhou" }
          $dir = Join-Path $env:LOCALAPPDATA "Programs\PT2VHF SDR Tool"
          if (-not (Test-Path "$dir\unins000.exe")) { throw "Instalação por usuário não encontrada em $dir" }
          if (-not (Test-Path "$dir\_internal\drivers\wdi-simple.exe")) { throw "wdi-simple.exe ausente da instalação" }
          $p = Start-Process -FilePath "$dir\PT2VHF-SDR-Tool.exe" -ArgumentList "--selftest" -Wait -PassThru
          Get-Content "$env:TEMP\pt2vhf-sdr-selftest.log"
          if ($p.ExitCode -ne 0) { throw "Programa instalado falhou no autoteste" }
      - name: P0 - packaged GUI crash diagnostics (Portable + Setup, synthetic simulator)
        run: |
          .\scripts\test_packaged_crash_diagnostics.ps1 -Executables @(
            "dist\PT2VHF-SDR-Tool-Portable.exe",
            (Join-Path $env:LOCALAPPDATA "Programs\PT2VHF SDR Tool\PT2VHF-SDR-Tool.exe")
          )
      - name: Smoke OTA Setup real (instalação, restart e falha segura)
        run: .\scripts\test_ota_setup_windows.ps1 -Version "${{ steps.ver.outputs.version }}"
      - name: Pacotes finais e SHA-256
        run: |
          $v = "${{ steps.ver.outputs.version }}"
          New-Item -ItemType Directory -Force release | Out-Null
          Copy-Item "dist\PT2VHF-SDR-Tool-v$v-Win11-x64-Setup.exe" release\
          Copy-Item "dist\PT2VHF-SDR-Tool-Portable.exe" "release\PT2VHF-SDR-Tool-v$v-Win11-x64-Portable.exe"
          Get-ChildItem release | ForEach-Object { "{0}  {1}  {2}" -f (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower(), $_.Length, $_.Name } | Tee-Object release\SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: PT2VHF-SDR-Tool-${{ steps.ver.outputs.version }}-windows
          path: release/
      - name: Publicar Release GitHub (origem para o site)
        if: github.event_name == 'push' && contains(github.event.head_commit.message, '[build-windows]')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $v = "${{ steps.ver.outputs.version }}"
          $assets = @(Get-ChildItem release -File | ForEach-Object { $_.FullName })
          & gh release create "v$v" $assets --repo "${{ github.repository }}" --target "${{ github.sha }}" `
            --title "PT2VHF SDR Tool $v" `
            --notes "Origem de pacotes para https://www.pt2vhf.com/sdr. Distribuição oficial somente pelo site."
          if ($LASTEXITCODE -ne 0) { throw "Falha ao publicar a Release GitHub" }
