name: Testes (build Windows sob demanda)

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      build_windows:
        description: "Gerar executável do Windows"
        type: boolean
        default: false

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Bibliotecas de sistema (Qt offscreen)
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3
      - run: pip install numpy scipy PySide6 pyqtgraph pytest
      - run: python -m pytest -q
        env:
          QT_QPA_PLATFORM: offscreen

  windows-exe:
    # Desativado por padrão: só roda manualmente (Actions → Run workflow → marcar "Gerar executável")
    if: github.event_name == 'workflow_dispatch' && inputs.build_windows
    runs-on: windows-latest
    needs: tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q
        env:
          QT_QPA_PLATFORM: offscreen
      - run: pyinstaller --noconfirm pt2vhf.spec
      - uses: actions/upload-artifact@v4
        with:
          name: PT2VHF-SDR-Tool-windows
          path: dist/PT2VHF-SDR-Tool
