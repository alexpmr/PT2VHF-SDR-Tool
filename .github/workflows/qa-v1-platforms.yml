name: v1.0 QA Windows Linux macOS (no publish)

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-unit:
    if: github.event_name == 'workflow_dispatch' || github.head_ref == 'feature/splash-v1.0'
    runs-on: windows-2022
    timeout-minutes: 45
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Windows GUI and OTA unit/integration tests
        run: python scripts/run_tests.py
      - name: P0 native Qt shutdown gate (v1 candidate, 40 subprocesses)
        # Native Windows process exit status catches heap corruption missed by pytest.
        # Synthetic Qt only; this is NOT real SDR hardware/OTA stability certification.
        run: python -X faulthandler scripts/probe_qt_native_exit.py --repeats 20 --scenarios waterfall-empty waterfall --exit-modes normal
      - name: OTA Portable helper with actual Windows processes
        shell: pwsh
        run: ./scripts/test_ota_windows.ps1
      - name: Check splash packaging prerequisite
        shell: pwsh
        run: |
          if (Test-Path 'pt2vhf/assets/branding/welcome-banner.jpg') {
            Write-Host 'SPLASH_BANNER=AVAILABLE'
          } else {
            Write-Host 'SPLASH_BANNER=MISSING: binary build intentionally blocked'
          }
      # Full Windows Setup/Portable builds are released only after P0
      # crash triage + image attachment. This job never publishes artifacts.

  linux-package-layout:
    if: github.event_name == 'workflow_dispatch' || github.head_ref == 'feature/splash-v1.0'
    runs-on: ubuntu-24.04
    container:
      image: mcr.microsoft.com/playwright/python:v1.64.1-noble
    timeout-minutes: 45
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - name: Dependencies
        run: python -m pip install numpy scipy PySide6==6.11.3 pyqtgraph pytest "sgp4>=2.23"
      - name: Test Linux package layout (deb / tgz) and GUI
        run: |
          python -m pytest -q tests/test_package_unix_v1.py tests/test_band_presets_v1.py tests/test_resource_meter.py tests/test_ota_helper_handshake_v1.py
      - name: Actual Linux binaries (only after original splash committed)
        shell: bash
        run: |
          if [ ! -f pt2vhf/assets/branding/welcome-banner.jpg ]; then
            echo "LINUX_NATIVE_PACKAGING=BLOCKED_MISSING_ORIGINAL_BANNER"
            exit 0
          fi
          python -m pip install -r requirements-dev.txt
          pyinstaller --noconfirm packaging/pt2vhf_unix.spec
          python packaging/package_unix.py --platform linux
          ls -lh release/
      - uses: actions/upload-artifact@v4
        if: hashFiles('release/*.deb') != ''
        with:
          name: pt2vhf-sdr-v1-linux-preview
          path: release/

  macos-native:
    if: github.event_name == 'workflow_dispatch' || github.head_ref == 'feature/splash-v1.0'
    runs-on: macos-15
    timeout-minutes: 65
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Dependencies for GUI regression tests
        run: python -m pip install numpy scipy PySide6==6.11.3 pyqtgraph pytest "sgp4>=2.23" sounddevice
      - name: macOS GUI and packaging contract tests
        run: |
          python -m pytest -q tests/test_package_unix_v1.py tests/test_resource_meter.py tests/test_band_presets_v1.py tests/test_ota_helper_handshake_v1.py
      - name: Build macOS app/dmg only with original splash
        shell: bash
        run: |
          if [ ! -f pt2vhf/assets/branding/welcome-banner.jpg ]; then
            echo "MACOS_NATIVE_PACKAGING=BLOCKED_MISSING_ORIGINAL_BANNER"
            exit 0
          fi
          python -m pip install -r requirements-dev.txt
          pyinstaller --noconfirm packaging/pt2vhf_unix.spec
          python packaging/package_unix.py --platform macos
          ls -lh release/
      - uses: actions/upload-artifact@v4
        if: hashFiles('release/*.dmg') != ''
        with:
          name: pt2vhf-sdr-v1-macos-preview
          path: release/

# Important: no upload to GitHub Releases, no site changes and no OTA manifest
# changes from this QA workflow. v0.13.3 crash P0 remains unresolved.
