name: Verificar publicação no site oficial
# Confere www.pt2vhf.com (página /sdr, updates.json, update.php e os pacotes com SHA-256),
# usando "Range: bytes=0-" para não inflar os contadores de download.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Versão esperada"
        required: true
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/verify_site.py "${{ inputs.version }}" --wait
