name: Publish PT2VHF SDR Tool v1.0.8 HF on RTL-SDR Blog V4/V4L
on:
  push:
    branches: [release/publish-v1.0.8-20261127]
    paths:
      - .github/workflows/publish-v108-validated.yml
permissions:
  contents: write
  actions: read
concurrency:
  group: pt2vhf-sdr-publish-v108
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      SOURCE_RUN_ID: "46042738863"
      SOURCE_SHA: "3132d9b1378b1786322ccce3639363648a9544e9"
      VERSION: "1.0.8"
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Await successful exact SHA candidate CI
        shell: bash
        run: |
          set -euo pipefail
          repo="${{ github.repository }}"
          for attempt in $(seq 1 40); do
            status="$(gh api "repos/$repo/actions/runs/$SOURCE_RUN_ID" --jq '.status')"
            conclusion="$(gh api "repos/$repo/actions/runs/$SOURCE_RUN_ID" --jq '.conclusion // ""')"
            actual="$(gh api "repos/$repo/actions/runs/$SOURCE_RUN_ID" --jq '.head_sha')"
            test "$actual" = "$SOURCE_SHA"
            if [ "$status" = "completed" ]; then
              test "$conclusion" = "success" || { echo "::error::CI ended: $conclusion"; exit 1; }
              exit 0
            fi
            sleep 20
          done
          echo "::error::CI completion timeout"
          exit 1
      - name: Verify exact tested build and binaries
        shell: bash
        run: |
          set -euo pipefail
          repo="${{ github.repository }}"
          actual="$(gh api "repos/$repo/actions/runs/$SOURCE_RUN_ID" --jq '.head_sha')"
          result="$(gh api "repos/$repo/actions/runs/$SOURCE_RUN_ID" --jq '.conclusion')"
          test "$actual" = "$SOURCE_SHA"
          test "$result" = "success"
          gh run download "$SOURCE_RUN_ID" --repo "$repo" \
            --name "PT2VHF-SDR-Tool-$VERSION-windows" --dir release
          for flavor in Setup Portable; do
            test -s "release/PT2VHF-SDR-Tool-v$VERSION-Win11-x64-$flavor.exe"
          done
          test -s "release/SHA256SUMS.txt"
          cd release
          sed '1s/^\xef\xbb\xbf//' SHA256SUMS.txt | tr -d '\r' | \
            awk 'NF == 3 {print $1 "  " $3}' | sha256sum --check --strict
          test "$(awk 'NF == 3 {n++} END {print n}' SHA256SUMS.txt)" -eq 2
      - name: Publish verified v1.0.8 release after all Windows/Linux CI gates
        shell: bash
        run: |
          set -euo pipefail
          repo="${{ github.repository }}"
          if gh api "repos/$repo/releases/tags/v$VERSION" >/dev/null 2>&1; then
            echo "::error::Release v$VERSION already exists; refusing to overwrite"
            exit 1
          fi
          gh release create "v$VERSION" release/*.exe release/SHA256SUMS.txt \
            --repo "$repo" --target "$SOURCE_SHA" \
            --title "PT2VHF SDR Tool v$VERSION — Windows x64" \
            --notes "v$VERSION — HF on RTL-SDR Blog V4 / V4 Lite (V4L). With the RTL-SDR Blog driver, HF is now received through the built-in upconverter of the V4 and V4L (0.5-1766 MHz). Previously the V4L (R820T tuner) could only tune HF with direct sampling enabled, which turns the tuner off and left the waterfall with plain noise. V4/V4L are detected from the USB strings; direct sampling is refused on these models with a notice, and saved settings or the automatic HF/VHF switch no longer enable it. Warning when a V4/V4L opens with the stock rtl-sdr library; Diagnostics shows the USB product. RTL-SDR Blog V3 and generic dongles unchanged. Qt/Linux suite: 283 passed, 3 skipped. Windows suite, packaged Setup/Portable selftests, silent Setup installation and OTA smoke passed on exact CI run $SOURCE_RUN_ID / SHA $SOURCE_SHA. Real-RF homologation on the V4L is still pending, as is real-RF homologation of RS41, ADS-B, AIS and ACARS. See CHANGELOG.md and BACKLOG.md."
          tag_sha="$(gh api "repos/$repo/git/ref/tags/v$VERSION" --jq '.object.sha')"
          test "$tag_sha" = "$SOURCE_SHA"
          gh api "repos/$repo/releases/tags/v$VERSION" > /tmp/release.json
          jq -e --arg v "$VERSION" '
            .draft == false and .prerelease == false and
            ([.assets[].name] | index("SHA256SUMS.txt") != null) and
            ([.assets[].name] | index("PT2VHF-SDR-Tool-v"+$v+"-Win11-x64-Setup.exe") != null) and
            ([.assets[].name] | index("PT2VHF-SDR-Tool-v"+$v+"-Win11-x64-Portable.exe") != null)
          ' /tmp/release.json
          echo "PT2VHF_SDR_V108_PUBLISHED=$tag_sha"
