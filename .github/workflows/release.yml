name: Release (origem dos arquivos do site)
# Cria a GitHub Release a partir dos binários de um build Windows aprovado.
# Downloads oficiais continuam somente em www.pt2vhf.com (a Release é só a origem).
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: "ID da execução do build Windows aprovada"
        required: true
      version:
        description: "Versão (ex.: 0.3.0)"
        required: true
permissions:
  contents: write
  actions: read
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Conferir o build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api repos/${{ github.repository }}/actions/runs/${{ inputs.run_id }} --jq '{status, conclusion, head_sha}' | tee /tmp/run.json
          jq -e '.status == "completed" and .conclusion == "success"' /tmp/run.json
          echo "SHA=$(jq -r .head_sha /tmp/run.json)" >> $GITHUB_ENV
      - uses: actions/download-artifact@v4
        with:
          run-id: ${{ inputs.run_id }}
          name: PT2VHF-SDR-Tool-${{ inputs.version }}-windows
          path: release
          github-token: ${{ github.token }}
      - name: Conferir SHA-256 e publicar a Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd release
          awk '{print $1"  "$3}' SHA256SUMS.txt | sha256sum -c -
          cd ..
          notes=$(awk '/^## \[${{ inputs.version }}\]/{f=1;next} /^## \[/{f=0} f' CHANGELOG.md 2>/dev/null || true)
          gh release create "v${{ inputs.version }}" release/* --repo ${{ github.repository }} \
            --target "$SHA" --title "PT2VHF SDR Tool ${{ inputs.version }}" \
            --notes "Origem dos arquivos publicados em https://www.pt2vhf.com/sdr (downloads e atualizações oficiais somente pelo site)."
