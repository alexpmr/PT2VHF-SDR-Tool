name: Build and attach PT2VHF SDR Tool v1.0.7 Linux and macOS
# Gera pacotes nativos Linux (.deb/.tgz) e macOS (.dmg/.app.tgz) da v1.0.7,
# com RS41 (fsk_demod/rs41mod) e AIS-catcher embarcados, roda o autoteste do
# executável empacotado e anexa à Release v1.0.7 já publicada (Windows intacto).
on:
  push:
    branches: [claude/project-thread-pue97w]
    paths:
      - .github/workflows/publish-v107-unix.yml
      - packaging/**
  workflow_dispatch:
    inputs:
      attach:
        description: "Anexar os pacotes à Release v1.0.7"
        type: boolean
        default: false
permissions:
  contents: write
concurrency:
  group: pt2vhf-sdr-publish-v107-unix
  cancel-in-progress: false
env:
  VERSION: "1.0.7"
  QT_QPA_PLATFORM: offscreen
  PT2VHF_NO_AUTOCONNECT: "1"
  PT2VHF_NO_STARTUP_DIALOGS: "1"

jobs:
  linux:
    # 22.04 (glibc 2.35) para rodar também em distribuições um pouco mais antigas.
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Dependências do sistema (Qt, PortAudio, libusb, compiladores)
        run: |
          sudo apt-get update -q || true
          sudo apt-get install -y -q libegl1 libgl1 libxkbcommon-x11-0 libxcb-cursor0 \
            libxcb-icccm4 libxcb-keysyms1 libxcb-shape0 libportaudio2 libusb-1.0-0 \
            cmake build-essential dpkg-dev || echo "apt indisponível: seguindo com o que a imagem tem"
          gcc --version | head -1; cmake --version | head -1; command -v dpkg-deb
      - name: Dependências Python
        run: python -m pip install -r requirements-dev.txt
      - name: Decodificadores nativos (RS41 e AIS-catcher)
        run: |
          bash packaging/build_sonde_decoders.sh native packaging/sonde_decoders
          bash packaging/prepare_ais_catcher.sh native packaging/ais_catcher
          ls -la packaging/sonde_decoders packaging/ais_catcher
      - name: Testes de empacotamento e decodificadores
        run: python -m pytest -q tests/test_package_unix_v1.py
      - name: PyInstaller
        run: pyinstaller --noconfirm packaging/pt2vhf_unix.spec
      - name: Autoteste do executável empacotado
        run: |
          set +e
          dist/pt2vhf-sdr/pt2vhf-sdr --selftest; rc=$?
          cat "$(python -c 'import tempfile;print(tempfile.gettempdir())')/pt2vhf-sdr-selftest.log"
          exit $rc
      - name: Pacotes .deb e .tgz
        run: |
          python packaging/package_unix.py --platform linux
          ls -l release/; cat release/SHA256SUMS-*.txt
      - name: Instalar o .deb e autotestar a cópia instalada
        run: |
          sudo apt-get install -y -q ./release/pt2vhf-sdr-tool_${VERSION}_amd64.deb || sudo dpkg -i ./release/pt2vhf-sdr-tool_${VERSION}_amd64.deb
          set +e
          /usr/bin/pt2vhf-sdr --selftest; rc=$?
          cat "$(python -c 'import tempfile;print(tempfile.gettempdir())')/pt2vhf-sdr-selftest.log"
          exit $rc
      - uses: actions/upload-artifact@v4
        with:
          name: PT2VHF-SDR-Tool-${{ env.VERSION }}-linux
          path: release/

  macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15        # Apple Silicon (arm64)
          # Intel fica de fora: o pyrnnoise não publica librnnoise.dylib x86_64
          # (autoteste do .app Intel falhou no RNNoise; decodificadores passaram).
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Ferramentas (sha256sum para os scripts de empacotamento)
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          if ! command -v sha256sum >/dev/null; then
            printf '#!/bin/sh\nexec shasum -a 256 "$@"\n' > "$RUNNER_TEMP/bin/sha256sum"
            chmod +x "$RUNNER_TEMP/bin/sha256sum"
          fi
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
          uname -m; sw_vers; cc --version | head -1; cmake --version | head -1
      - name: Dependências Python
        # pyrnnoise 0.4.5 não publica wheel para macOS: usa a 0.4.x disponível, com o
        # audiolab anterior à 0.5.2 (a 0.5.2 removeu o argumento rate usado pela 0.4.3) e PyAV < 18 (sem av.option).
        # (o autoteste do executável empacotado confere o RNNoise logo abaixo).
        run: |
          grep -v '^pyrnnoise' requirements.txt > "$RUNNER_TEMP/req-macos.txt"
          python -m pip install -r "$RUNNER_TEMP/req-macos.txt" "pyrnnoise>=0.4,<0.5" "audiolab<0.5.2" "av<18" pytest "pyinstaller>=6.3"
          python -m pip show pyrnnoise | head -2
      - name: Decodificadores nativos (RS41 e AIS-catcher)
        env:
          MACOSX_DEPLOYMENT_TARGET: "13.0"
          # Só o cliente rtl_tcp é usado: nada de bibliotecas do Homebrew (feitas
          # para o macOS do runner) dentro do pacote.
          AIS_CMAKE_ARGS: >-
            -DOPENSSL=OFF -DZMQ=OFF -DPSQL=OFF -DSOXR=OFF -DSAMPLERATE=OFF
            -DRTLSDR=OFF -DAIRSPY=OFF -DAIRSPYHF=OFF -DHACKRF=OFF -DSDRPLAY=OFF -DHYDRASDR=OFF
        run: |
          bash packaging/build_sonde_decoders.sh native packaging/sonde_decoders
          bash packaging/prepare_ais_catcher.sh native packaging/ais_catcher
          ls -la packaging/sonde_decoders packaging/ais_catcher
          for b in packaging/ais_catcher/AIS-catcher packaging/sonde_decoders/fsk_demod packaging/sonde_decoders/rs41mod; do
            otool -L "$b"
            if otool -L "$b" | tail -n +2 | grep -Ev '^\s+(/usr/lib/|/System/)'; then
              echo "::error::$b depende de biblioteca fora do sistema"; exit 1
            fi
          done
      - name: Testes de empacotamento
        run: python -m pytest -q tests/test_package_unix_v1.py
      - name: PyInstaller (.app)
        run: pyinstaller --noconfirm packaging/pt2vhf_unix.spec
      - name: Autoteste do executável empacotado
        run: |
          set +e
          "dist/PT2VHF SDR Tool.app/Contents/MacOS/pt2vhf-sdr" --selftest; rc=$?
          cat "$(python -c 'import tempfile;print(tempfile.gettempdir())')/pt2vhf-sdr-selftest.log"
          exit $rc
      - name: Pacotes .dmg e .app.tgz
        run: |
          python packaging/package_unix.py --platform macos
          ls -l release/; cat release/SHA256SUMS-*.txt
      - uses: actions/upload-artifact@v4
        with:
          name: PT2VHF-SDR-Tool-${{ env.VERSION }}-macos-${{ matrix.runner }}
          path: release/

  attach:
    needs: [linux, macos]
    if: github.event_name == 'push' || inputs.attach
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dl
          pattern: PT2VHF-SDR-Tool-*
      - name: Conferir SHA-256 e reunir pacotes
        run: |
          set -euo pipefail
          mkdir release
          for d in dl/*/; do (cd "$d" && sha256sum --check --strict SHA256SUMS-*.txt); cp "$d"/* release/; done
          ls -l release
          test -s "release/pt2vhf-sdr-tool_${VERSION}_amd64.deb"
          test -s "release/PT2VHF-SDR-Tool-v${VERSION}-Linux-x86_64.tgz"
          ls release/PT2VHF-SDR-Tool-v${VERSION}-macOS-*.dmg
      - name: Anexar à Release v1.0.7 (sem sobrescrever)
        run: |
          set -euo pipefail
          repo="${{ github.repository }}"
          gh api "repos/$repo/releases/tags/v$VERSION" > rel.json
          for f in release/*; do
            if jq -e --arg n "$(basename "$f")" '[.assets[].name] | index($n) != null' rel.json >/dev/null; then
              echo "::error::$(basename "$f") já existe na Release; não sobrescrevo"; exit 1
            fi
          done
          gh release upload "v$VERSION" release/* --repo "$repo"
          gh api "repos/$repo/releases/tags/v$VERSION" --jq '.assets[] | "\(.name)  \(.size)  \(.digest // "")"'
