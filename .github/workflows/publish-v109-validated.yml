name: Publish PT2VHF SDR Tool v1.0.9 favorites, continuous Auto and waterfall zoom FFT
on:
  push:
    branches: [release/publish-v1.0.9-20261127]
    paths:
      - .github/workflows/publish-v109-validated.yml
permissions:
  contents: write
  actions: read
concurrency:
  group: pt2vhf-sdr-publish-v109
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      SOURCE_RUN_ID: "46057765151"
      SOURCE_SHA: "b64aebe00e3281b945d3e05f76083ac81e1c5089"
      VERSION: "1.0.9"
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Await successful exact SHA candidate CI
        shell: bash
        run: |
          set -euo pipefail
          repo="${{ github.repository }}"
          for attempt in $(seq 1 40); do
            status="$(gh api "repos/$repo/actions/runs/$SOURCE_RUN_ID" --jq '.status')"
            conclusion="$(gh api "repos/$repo/actions/runs/$SOURCE_RUN_ID" --jq '.conclusion // ""')"
            actual="$(gh api "repos/$repo/actions/runs/$SOURCE_RUN_ID" --jq '.head_sha')"
            test "$actual" = "$SOURCE_SHA"
            if [ "$status" = "completed" ]; then
              test "$conclusion" = "success" || { echo "::error::CI ended: $conclusion"; exit 1; }
              exit 0
            fi
            sleep 20
          done
          echo "::error::CI completion timeout"
          exit 1
      - name: Verify exact tested build and binaries
        shell: bash
        run: |
          set -euo pipefail
          repo="${{ github.repository }}"
          actual="$(gh api "repos/$repo/actions/runs/$SOURCE_RUN_ID" --jq '.head_sha')"
          result="$(gh api "repos/$repo/actions/runs/$SOURCE_RUN_ID" --jq '.conclusion')"
          test "$actual" = "$SOURCE_SHA"
          test "$result" = "success"
          gh run download "$SOURCE_RUN_ID" --repo "$repo" \
            --name "PT2VHF-SDR-Tool-$VERSION-windows" --dir release
          for flavor in Setup Portable; do
            test -s "release/PT2VHF-SDR-Tool-v$VERSION-Win11-x64-$flavor.exe"
          done
          test -s "release/SHA256SUMS.txt"
          cd release
          sed '1s/^\xef\xbb\xbf//' SHA256SUMS.txt | tr -d '\r' | \
            awk 'NF == 3 {print $1 "  " $3}' | sha256sum --check --strict
          test "$(awk 'NF == 3 {n++} END {print n}' SHA256SUMS.txt)" -eq 2
      - name: Publish verified v1.0.9 release after all Windows/Linux CI gates
        shell: bash
        run: |
          set -euo pipefail
          repo="${{ github.repository }}"
          if gh api "repos/$repo/releases/tags/v$VERSION" >/dev/null 2>&1; then
            echo "::error::Release v$VERSION already exists; refusing to overwrite"
            exit 1
          fi
          gh release create "v$VERSION" release/*.exe release/SHA256SUMS.txt \
            --repo "$repo" --target "$SOURCE_SHA" \
            --title "PT2VHF SDR Tool v$VERSION — Windows x64" \
            --notes "v$VERSION — Favorites, continuous waterfall Auto and real zoom resolution. Favorites moved from a row of buttons to a compact drop-down menu sorted by how often each memory is used (use count saved in memories.json; older files still load). The waterfall Auto button is now an on/off toggle: floor/ceiling follow the signal every second (on by default; moving Floor/Ceiling turns it off; Ctrl+L still adjusts once), so UHF with FFT 32768 no longer goes black. Zoom FFT: at high zoom (e.g. 10 kHz) the waterfall and spectrum come from a DDC of the visible span (mixer, polyphase FIR + Chebyshev II, decimation) with its own FFT of about 2048 bins on screen; at 2.4 MS/s a 10 kHz zoom goes from ~73 Hz/bin to ~3.7 Hz/bin. ACARS and ADS-B are embedded since v1.0.7 (no change). Qt/Linux suite and Windows suite, packaged Setup/Portable selftests, silent Setup installation and OTA smoke passed on exact CI run $SOURCE_RUN_ID / SHA $SOURCE_SHA. Real-SDR homologation of the zoom FFT and real-RF homologation of RS41, ADS-B, AIS, ACARS and the V4L HF path are still pending. See CHANGELOG.md and BACKLOG.md."
          tag_sha="$(gh api "repos/$repo/git/ref/tags/v$VERSION" --jq '.object.sha')"
          test "$tag_sha" = "$SOURCE_SHA"
          gh api "repos/$repo/releases/tags/v$VERSION" > /tmp/release.json
          jq -e --arg v "$VERSION" '
            .draft == false and .prerelease == false and
            ([.assets[].name] | index("SHA256SUMS.txt") != null) and
            ([.assets[].name] | index("PT2VHF-SDR-Tool-v"+$v+"-Win11-x64-Setup.exe") != null) and
            ([.assets[].name] | index("PT2VHF-SDR-Tool-v"+$v+"-Win11-x64-Portable.exe") != null)
          ' /tmp/release.json
          echo "PT2VHF_SDR_V109_PUBLISHED=$tag_sha"
