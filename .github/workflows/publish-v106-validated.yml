name: Publish PT2VHF SDR Tool v1.0.6 waterfall clarity and UI fixes
on:
  push:
    branches: [release/publish-v1.0.6-20261122]
    paths:
      - .github/workflows/publish-v106-validated.yml
permissions:
  contents: write
  actions: read
concurrency:
  group: pt2vhf-sdr-publish-v106
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      SOURCE_RUN_ID: "45074010119"
      SOURCE_SHA: "e32d3566d1f118938d3cc84447f2f517a4b12493"
      VERSION: "1.0.6"
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Await successful exact SHA candidate CI
        shell: bash
        run: |
          set -euo pipefail
          repo="${{ github.repository }}"
          for attempt in $(seq 1 40); do
            status="$(gh api "repos/$repo/actions/runs/$SOURCE_RUN_ID" --jq '.status')"
            conclusion="$(gh api "repos/$repo/actions/runs/$SOURCE_RUN_ID" --jq '.conclusion // ""')"
            actual="$(gh api "repos/$repo/actions/runs/$SOURCE_RUN_ID" --jq '.head_sha')"
            test "$actual" = "$SOURCE_SHA"
            if [ "$status" = "completed" ]; then
              test "$conclusion" = "success" || { echo "::error::CI ended: $conclusion"; exit 1; }
              exit 0
            fi
            sleep 20
          done
          echo "::error::CI completion timeout"
          exit 1
      - name: Verify exact tested build and binaries
        shell: bash
        run: |
          set -euo pipefail
          repo="${{ github.repository }}"
          actual="$(gh api "repos/$repo/actions/runs/$SOURCE_RUN_ID" --jq '.head_sha')"
          result="$(gh api "repos/$repo/actions/runs/$SOURCE_RUN_ID" --jq '.conclusion')"
          test "$actual" = "$SOURCE_SHA"
          test "$result" = "success"
          gh run download "$SOURCE_RUN_ID" --repo "$repo" \
            --name "PT2VHF-SDR-Tool-$VERSION-windows" --dir release
          for flavor in Setup Portable; do
            test -s "release/PT2VHF-SDR-Tool-v$VERSION-Win11-x64-$flavor.exe"
          done
          test -s "release/SHA256SUMS.txt"
          cd release
          sed '1s/^\xef\xbb\xbf//' SHA256SUMS.txt | tr -d '\r' | \
            awk 'NF == 3 {print $1 "  " $3}' | sha256sum --check --strict
          test "$(awk 'NF == 3 {n++} END {print n}' SHA256SUMS.txt)" -eq 2
      - name: Publish verified v1.0.6 release after all Windows/Linux CI gates
        shell: bash
        run: |
          set -euo pipefail
          repo="${{ github.repository }}"
          if gh api "repos/$repo/releases/tags/v$VERSION" >/dev/null 2>&1; then
            echo "::error::Release v$VERSION already exists; refusing to overwrite"
            exit 1
          fi
          gh release create "v$VERSION" release/*.exe release/SHA256SUMS.txt \
            --repo "$repo" --target "$SOURCE_SHA" \
            --title "PT2VHF SDR Tool v$VERSION — Windows x64" \
            --notes "v$VERSION — Fixes user-reported waterfall #24 native FFT definition at high zoom (preserves original 32768-point FFT bins in bounded 400-row float16 history; image raster adapts to viewport width and uses linear mean-power pooling at wide zoom), fixes #23 manual zoom-out beyond captured IQ bandwidth, and adds always-visible hide/show audio-DSP sidebar button plus Ctrl+Shift+A and persisted settings. Qt/Linux suite: 259 tests passed including close-carrier/zoom/history/sidebar regressions. Windows suite, both packaged Setup/Portable, native OTA PowerShell probe, silent Setup installation and OTA smoke were required to pass on exact CI run $SOURCE_RUN_ID / SHA $SOURCE_SHA by this workflow. All previous stable v1.0.5 features preserved. Scope: fixes targeted visualization/backlog items only, NOT the complete historical backlog. SDRplay/Mirics Soapy USB drivers are not bundled; RS41 RF frame decoding and RSP physical reception remain unhomologated. IQ/ONNX remains experimental outside this stable release. Windows crash #8 and user's physical OTA #18 remain open pending field evidence. Splash remains text fallback; see BACKLOG.md."
          tag_sha="$(gh api "repos/$repo/git/ref/tags/v$VERSION" --jq '.object.sha')"
          test "$tag_sha" = "$SOURCE_SHA"
          gh api "repos/$repo/releases/tags/v$VERSION" > /tmp/release.json
          jq -e --arg v "$VERSION" '
            .draft == false and .prerelease == false and
            ([.assets[].name] | index("SHA256SUMS.txt") != null) and
            ([.assets[].name] | index("PT2VHF-SDR-Tool-v"+$v+"-Win11-x64-Setup.exe") != null) and
            ([.assets[].name] | index("PT2VHF-SDR-Tool-v"+$v+"-Win11-x64-Portable.exe") != null)
          ' /tmp/release.json
          echo "PT2VHF_SDR_V106_PUBLISHED=$tag_sha"
