name: Experimental IQ model training and ONNX export
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'scripts/train_iq_synthetic_ci.py'
      - 'scripts/train_iq_augmented_v3.py'
      - 'scripts/train_iq_unknown_v4.py'
      - 'scripts/iq_unknown_curriculum.py'
      - 'scripts/iq_augmentation.py'
      - 'scripts/compare_iq_stress.py'
      - 'scripts/iq_out_of_family.py'
      - 'scripts/evaluate_iq_ood.py'
      - 'scripts/evaluate_iq_recordings.py'
      - 'scripts/smoke_iq_wav_onnx.py'
      - 'scripts/export_iq_synthetic_v2.py'
      - 'scripts/evaluate_iq_synthetic_stress.py'
      - 'pt2vhf/dsp/iq_classifier.py'
      - 'pt2vhf/dsp/iq_classifier_worker.py'
      - 'tests/test_iq_classifier_resampling.py'
      - 'tests/test_iq_classifier_contract.py'
      - 'tests/test_iq_augmentation.py'
      - 'tests/test_iq_ood_signals.py'
      - 'tests/test_iq_unknown_curriculum.py'
      - 'tests/test_iq_recordings.py'
      - '.github/workflows/iq-model-export.yml'
jobs:
  train-export-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install CPU inference and export dependencies
        run: |
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install numpy onnx onnxruntime onnxscript
      - name: Train reproducible synthetic baseline
        run: python scripts/train_iq_synthetic_ci.py
      - name: Export and verify ONNX numerical parity
        run: python scripts/export_iq_synthetic_v2.py --checkpoint models/iq/synthetic_v2.pt --output models/iq/synthetic_v2.onnx
      - name: Train experimental augmented candidate (not deployable)
        run: python scripts/train_iq_augmented_v3.py
      - name: Export and verify candidate ONNX
        run: python scripts/export_iq_synthetic_v2.py --checkpoint models/iq/synthetic_v3.pt --output models/iq/synthetic_v3.onnx
      - name: Train UNKNOWN-diverse v4 candidate (experimental only)
        run: python scripts/train_iq_unknown_v4.py
      - name: Export and verify v4 candidate ONNX
        run: python scripts/export_iq_synthetic_v2.py --checkpoint models/iq/synthetic_v4.pt --output models/iq/synthetic_v4.onnx
      - name: Train intermediate UNKNOWN v5 candidate (45%, diagnostic only)
        run: python scripts/train_iq_unknown_v4.py --unknown-fraction 0.45 --model-stem synthetic_v5
      - name: Export and verify v5 ONNX
        run: python scripts/export_iq_synthetic_v2.py --checkpoint models/iq/synthetic_v5.pt --output models/iq/synthetic_v5.onnx
      - name: Smoke-test application ONNX classifier
        run: |
          python - <<'PY'
          import numpy as np
          from pt2vhf.dsp.iq_classifier import IQClassifier
          model = IQClassifier("models/iq/synthetic_v2.onnx")
          iq = np.exp(2j * np.pi * np.arange(4096) / 40).astype(np.complex64)
          result = model.predict(iq)
          assert result.mode in ("CW", "AM", "NFM", "WFM", "USB", "LSB", "UNKNOWN")
          assert abs(sum(result.probabilities.values()) - 1.0) < 1e-5
          print(result)
          PY
      - name: Evaluate ONNX on unseen synthetic signals and RF-like impairments
        run: |
          PYTHONPATH=. python scripts/evaluate_iq_synthetic_stress.py --model models/iq/synthetic_v2.onnx --output models/iq/synthetic_v2_stress_metrics.json
          PYTHONPATH=. python scripts/evaluate_iq_synthetic_stress.py --model models/iq/synthetic_v3.onnx --output models/iq/synthetic_v3_stress_metrics.json
      - name: Compare augmented candidate with fixed synthetic baseline
        run: |
          python scripts/compare_iq_stress.py --reference models/iq/synthetic_v2_stress_metrics.json --candidate models/iq/synthetic_v3_stress_metrics.json --output models/iq/synthetic_v3_comparison.json
      - name: Diagnose out-of-family IQ and false-confidence errors
        run: |
          PYTHONPATH=. python scripts/evaluate_iq_ood.py --reference models/iq/synthetic_v2.onnx --candidate models/iq/synthetic_v3.onnx --third-model models/iq/synthetic_v4.onnx --fourth-model models/iq/synthetic_v5.onnx --output models/iq/synthetic_v3_ood_metrics.json
      - name: Smoke-test WAV parser with real ONNX models and synthetic-only data
        run: PYTHONPATH=. python scripts/smoke_iq_wav_onnx.py
      - name: Install Qt Linux system libraries
        run: sudo apt-get update && sudo apt-get install -y libegl1 libopengl0 libxkbcommon-x11-0 libxcb-cursor0
      - name: Run IQ classifier unit tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python -m pip install scipy pytest PySide6==6.11.3
          python -m pytest -q tests/test_iq_classifier.py tests/test_iq_classifier_worker.py tests/test_iq_classifier_resampling.py tests/test_iq_classifier_contract.py tests/test_iq_augmentation.py tests/test_iq_ood_signals.py tests/test_iq_unknown_curriculum.py tests/test_iq_recordings.py
      - name: Verify synthetic validation metrics and record checksums
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path("models/iq/synthetic_v2_metrics.json")
          data = json.loads(p.read_text(encoding="utf-8"))
          print("Synthetic validation metrics:", data)
          stress = json.loads(Path("models/iq/synthetic_v2_stress_metrics.json").read_text(encoding="utf-8"))
          assert data["validation_samples"] == 1400
          assert data["accuracy"] >= 0.94
          assert stress["scope"].startswith("Experimental synthetic-only")
          assert len(stress["conditions"]) == 6
          candidate = json.loads(Path("models/iq/synthetic_v3_metrics.json").read_text(encoding="utf-8"))
          comparison = json.loads(Path("models/iq/synthetic_v3_comparison.json").read_text(encoding="utf-8"))
          assert candidate["labels"] == data["labels"]
          assert candidate["validation_v2_seed"]["accuracy"] >= 0.94
          assert all(comparison["criteria"].values())
          ood = json.loads(Path("models/iq/synthetic_v3_ood_metrics.json").read_text(encoding="utf-8"))
          assert ood["classes_not_evaluated"] == ["WFM"]
          assert ood["models"]["v2"]["labeled_samples"] == ood["models"]["v3"]["labeled_samples"]
          assert ood["models"]["v2"]["negative_samples"] == ood["models"]["v3"]["negative_samples"]
          assert set(ood["models"]) == {"v2", "v3", "v4", "v5"}
          assert ood["models"]["v4"]["negative_samples"] == 320
          assert ood["models"]["v4"]["labeled_samples"] == 960
          assert ood["models"]["v5"]["labeled_samples"] == 960
          assert ood["models"]["v5"]["negative_samples"] == 320
          unknown4 = json.loads(Path("models/iq/synthetic_v4_metrics.json").read_text(encoding="utf-8"))
          assert unknown4["labels"] == data["labels"]
          assert unknown4["unknown_examples_replaced"] > 0
          unknown5 = json.loads(Path("models/iq/synthetic_v5_metrics.json").read_text(encoding="utf-8"))
          assert unknown5["labels"] == data["labels"]
          assert 0 < unknown5["unknown_examples_replaced"] < unknown4["unknown_examples_replaced"]
          for m in ("v2", "v3", "v4", "v5"):
            curve = ood["models"][m]["confidence_threshold_analysis"]
            assert list(curve) == ["0.8", "0.9", "0.95", "0.99", "0.999"]
            assert curve["0.8"]["ood_samples"] == 320
            assert curve["0.8"]["known_samples"] == 800
            assert curve["0.8"]["unknown_samples"] == 160
            assert curve["0.999"]["ood_negative_misaccepted"] <= curve["0.8"]["ood_negative_misaccepted"]
          assert stress["conditions"]["nominal"]["top1_accuracy"] >= 0.94
          assert p.is_file() and Path("models/iq/synthetic_v2.onnx").stat().st_size > 0
          wav_smoke = json.loads(Path("models/iq/synthetic_wav_smoke_metrics.json").read_text(encoding="utf-8"))
          assert wav_smoke["source"].startswith("SYNTHETIC WAV ONLY")
          assert set(wav_smoke["result"]["models"]) == {"v2","v3","v4","v5"}
          PY
          cd models/iq
          sha256sum synthetic_v2.onnx synthetic_v2.pt synthetic_v2_metrics.json synthetic_v2_stress_metrics.json synthetic_v3.onnx synthetic_v3.pt synthetic_v3_metrics.json synthetic_v3_stress_metrics.json synthetic_v3_comparison.json synthetic_v3_ood_metrics.json synthetic_v4.onnx synthetic_v4.pt synthetic_v4_metrics.json synthetic_v5.onnx synthetic_v5.pt synthetic_v5_metrics.json synthetic_wav_smoke_metrics.json > SHA256SUMS
          sha256sum -c SHA256SUMS
      - name: Upload experimental model and metrics
        uses: actions/upload-artifact@v4
        with:
          name: pt2vhf-iq-synthetic-onnx-experimental
          path: |
            models/iq/synthetic_v2.onnx
            models/iq/synthetic_v2.pt
            models/iq/synthetic_v2_metrics.json
            models/iq/synthetic_v2_stress_metrics.json
            models/iq/synthetic_v3.onnx
            models/iq/synthetic_v3.pt
            models/iq/synthetic_v3_metrics.json
            models/iq/synthetic_v3_stress_metrics.json
            models/iq/synthetic_v3_comparison.json
            models/iq/synthetic_v3_ood_metrics.json
            models/iq/synthetic_v4.onnx
            models/iq/synthetic_v4.pt
            models/iq/synthetic_v4_metrics.json
            models/iq/synthetic_v5.onnx
            models/iq/synthetic_v5.pt
            models/iq/synthetic_v5_metrics.json
            models/iq/synthetic_wav_smoke_metrics.json
            models/iq/SHA256SUMS
          if-no-files-found: error
