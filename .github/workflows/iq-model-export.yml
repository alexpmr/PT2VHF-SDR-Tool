name: Experimental IQ model training and ONNX export
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'scripts/train_iq_synthetic_ci.py'
      - 'scripts/export_iq_synthetic_v2.py'
      - 'pt2vhf/dsp/iq_classifier.py'
      - '.github/workflows/iq-model-export.yml'
jobs:
  train-export-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install CPU inference and export dependencies
        run: python -m pip install torch numpy onnx onnxruntime
      - name: Train reproducible synthetic baseline
        run: python scripts/train_iq_synthetic_ci.py
      - name: Export and verify ONNX numerical parity
        run: python scripts/export_iq_synthetic_v2.py --checkpoint models/iq/synthetic_v2.pt --output models/iq/synthetic_v2.onnx
      - name: Smoke-test application ONNX classifier
        run: |
          python - <<'PY'
          import numpy as np
          from pt2vhf.dsp.iq_classifier import IQClassifier
          model = IQClassifier("models/iq/synthetic_v2.onnx")
          iq = np.exp(2j * np.pi * np.arange(4096) / 40).astype(np.complex64)
          result = model.predict(iq)
          assert result.mode in ("CW", "AM", "NFM", "WFM", "USB", "LSB", "UNKNOWN")
          assert abs(sum(result.probabilities.values()) - 1.0) < 1e-5
          print(result)
          PY
      - name: Upload experimental model and metrics
        uses: actions/upload-artifact@v4
        with:
          name: pt2vhf-iq-synthetic-onnx-experimental
          path: |
            models/iq/synthetic_v2.onnx
            models/iq/synthetic_v2.pt
            models/iq/synthetic_v2_metrics.json
          if-no-files-found: error
