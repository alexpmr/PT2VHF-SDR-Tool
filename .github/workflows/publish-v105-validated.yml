name: Publish PT2VHF SDR Tool v1.0.5 verified stable consolidation
on:
  push:
    branches: [release/publish-v1.0.5-20261119]
    paths:
      - .github/workflows/publish-v105-validated.yml
permissions:
  contents: write
  actions: read
concurrency:
  group: pt2vhf-sdr-publish-v105
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      SOURCE_RUN_ID: "44568451628"
      SOURCE_SHA: "06f34232458182ec914aaa76e20d1239eacfae8b"
      VERSION: "1.0.5"
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Await successful exact SHA candidate CI
        shell: bash
        run: |
          set -euo pipefail
          repo="${{ github.repository }}"
          for attempt in $(seq 1 40); do
            status="$(gh api "repos/$repo/actions/runs/$SOURCE_RUN_ID" --jq '.status')"
            conclusion="$(gh api "repos/$repo/actions/runs/$SOURCE_RUN_ID" --jq '.conclusion // ""')"
            actual="$(gh api "repos/$repo/actions/runs/$SOURCE_RUN_ID" --jq '.head_sha')"
            test "$actual" = "$SOURCE_SHA"
            if [ "$status" = "completed" ]; then
              test "$conclusion" = "success" || { echo "::error::CI ended: $conclusion"; exit 1; }
              exit 0
            fi
            sleep 20
          done
          echo "::error::CI completion timeout"
          exit 1
      - name: Verify exact tested build and binaries
        shell: bash
        run: |
          set -euo pipefail
          repo="${{ github.repository }}"
          actual="$(gh api "repos/$repo/actions/runs/$SOURCE_RUN_ID" --jq '.head_sha')"
          result="$(gh api "repos/$repo/actions/runs/$SOURCE_RUN_ID" --jq '.conclusion')"
          test "$actual" = "$SOURCE_SHA"
          test "$result" = "success"
          gh run download "$SOURCE_RUN_ID" --repo "$repo" \
            --name "PT2VHF-SDR-Tool-$VERSION-windows" --dir release
          for flavor in Setup Portable; do
            test -s "release/PT2VHF-SDR-Tool-v$VERSION-Win11-x64-$flavor.exe"
          done
          test -s "release/SHA256SUMS.txt"
          cd release
          sed '1s/^\xef\xbb\xbf//' SHA256SUMS.txt | tr -d '\r' | \
            awk 'NF == 3 {print $1 "  " $3}' | sha256sum --check --strict
          test "$(awk 'NF == 3 {n++} END {print n}' SHA256SUMS.txt)" -eq 2
      - name: Publish verified v1.0.5 release with honest hardware caveats
        shell: bash
        run: |
          set -euo pipefail
          repo="${{ github.repository }}"
          if gh api "repos/$repo/releases/tags/v$VERSION" >/dev/null 2>&1; then
            echo "::error::Release v$VERSION already exists; refusing to overwrite"
            exit 1
          fi
          gh release create "v$VERSION" release/*.exe release/SHA256SUMS.txt \
            --repo "$repo" --target "$SOURCE_SHA" \
            --title "PT2VHF SDR Tool v$VERSION — Windows x64" \
            --notes "v$VERSION — Consolidation of all previously CI-approved v1.0.4 stable capabilities. Preserves RTL-SDR, rtl_tcp, SoapySDR, SDRplay/Mirics experimental backend detection, waterfall/VFO, upconverter, LCD, audio, local transcription, OTA PowerShell READY probe and RS41 external-decoder diagnostics. Added six release-contract regression tests and reconciled BACKLOG and field validation status. Linux Qt: 254 tests passed; Windows tests, native packaged OTA probe, Setup/Portable builds, silent install and OTA Setup smoke must have passed this exact run $SOURCE_RUN_ID SHA $SOURCE_SHA, verified by this publish workflow. This is NOT a claim of hardware validation: RSP1 requires nonbundled SoapySDR/USB drivers, RS41 frame decoding requires external binaries and RF tests; Windows crash issue #8 and on-device OTA issue #18 remain open. The experimental IQ/ONNX classifier PR #2 is excluded. Original graphic splash not available in this package. Source evidence: docs/RELEASE_1.0.5_STABLE.md."
          tag_sha="$(gh api "repos/$repo/git/ref/tags/v$VERSION" --jq '.object.sha')"
          test "$tag_sha" = "$SOURCE_SHA"
          gh api "repos/$repo/releases/tags/v$VERSION" > /tmp/release.json
          jq -e --arg v "$VERSION" '
            .draft == false and .prerelease == false and
            ([.assets[].name] | index("SHA256SUMS.txt") != null) and
            ([.assets[].name] | index("PT2VHF-SDR-Tool-v"+$v+"-Win11-x64-Setup.exe") != null) and
            ([.assets[].name] | index("PT2VHF-SDR-Tool-v"+$v+"-Win11-x64-Portable.exe") != null)
          ' /tmp/release.json
          echo "PT2VHF_SDR_V105_PUBLISHED=$tag_sha"
