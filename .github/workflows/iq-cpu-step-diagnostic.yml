name: Experimental IQ CPU first-step diagnosis (synthetic)
on:
  workflow_dispatch:
  push:
    branches:
      - feature/iq-signal-classifier
    paths:
      - 'scripts/diagnose_iq_cpu_step.py'
      - 'scripts/compare_iq_cpu_step.py'
      - 'tests/test_iq_cpu_step_compare.py'
      - 'tests/test_iq_cpu_conv_reference.py'
      - '.github/workflows/iq-cpu-step-diagnostic.yml'
jobs:
  reference:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install CPU torch and numpy
        run: |
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install numpy
      - name: Validate bounded scalar Conv1d reference (synthetic)
        run: |
          python -m pip install pytest
          python -m pytest -q --noconftest tests/test_iq_cpu_conv_reference.py
      - name: Compute first four actual v4 synthetic optimizer steps
        env:
          ATEN_CPU_CAPABILITY: default
          MKL_CBWR: COMPATIBLE
          OMP_NUM_THREADS: '1'
          MKL_NUM_THREADS: '1'
        run: |
          python -m py_compile scripts/diagnose_iq_cpu_step.py
          python scripts/diagnose_iq_cpu_step.py --output diagnostics/reference.json
      - uses: actions/upload-artifact@v4
        with:
          name: pt2vhf-iq-cpu-step-reference
          path: diagnostics/reference.json
          retention-days: 30
  independent:
    needs: reference
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install CPU torch and numpy
        run: |
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install numpy
      - uses: actions/download-artifact@v4
        with:
          name: pt2vhf-iq-cpu-step-reference
          path: diagnostics
      - name: Compute independent first four v4 synthetic steps
        env:
          ATEN_CPU_CAPABILITY: default
          MKL_CBWR: COMPATIBLE
          OMP_NUM_THREADS: '1'
          MKL_NUM_THREADS: '1'
        run: python scripts/diagnose_iq_cpu_step.py --output diagnostics/independent.json
      - name: Locate first divergent v4 optimizer stage
        run: |
          python scripts/compare_iq_cpu_step.py \
            --reference diagnostics/reference.json \
            --independent diagnostics/independent.json \
            --out diagnostics/comparison.json
      - name: Upload numerical comparison
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pt2vhf-iq-cpu-step-comparison
          path: diagnostics/
          retention-days: 30
