name: QA MSI-SDR RSP1 detection (no publishing)

on:
  push:
    branches:
      - feature/msi-sdr-rsp1-mirics
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mirics-detection:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Qt native Linux runtime
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y libegl1 libopengl0
      - name: Dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Mirics tests
        run: python -m pytest tests/test_mirics_detection.py -q
      - name: Compile touched Python modules
        run: python -m compileall -q pt2vhf/sources/mirics.py pt2vhf/ui/panels.py pt2vhf/ui/main_window.py
