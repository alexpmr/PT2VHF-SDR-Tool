[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pt2vhf-sdr-tool"
version = "0.13.3"
description = "Receptor SDR com interface estilo rádio para radioamadores (RTL-SDR, rtl_tcp, SoapySDR)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26", "scipy>=1.11", "PySide6==6.11.3", "pyqtgraph>=0.13.3",
  "sounddevice>=0.4.6", "pyrtlsdr[lib]>=0.3.0", "sgp4>=2.23",
  "pyrnnoise==0.4.5", "faster-whisper>=1.2,<2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pyinstaller>=6.3"]

[project.gui-scripts]
pt2vhf-sdr = "pt2vhf.app:main"

[tool.setuptools.packages.find]
include = ["pt2vhf*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning:pyqtgraph.*"]
